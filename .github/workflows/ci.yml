name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacao:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: `dbt parse` valida o projeto sem conectar ao Snowflake
      SNOWFLAKE_ACCOUNT: ci-placeholder
      SNOWFLAKE_USER: ci-placeholder
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxe do Python
        run: python -m compileall -q src

      - name: Gerar dados de exemplo
        run: python src/generate_sample_data.py

      - name: Validar o projeto dbt (parse)
        working-directory: dbt_project
        run: |
          cp profiles.yml.example profiles.yml
          dbt parse --profiles-dir .
