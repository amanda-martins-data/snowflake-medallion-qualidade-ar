version: 2

models:
  - name: silver_air_quality
    description: >
      Medições de qualidade do ar limpas, tipadas e deduplicadas.
      Uma linha por estação, poluente e horário de medição.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [location_id, parameter, measured_at_utc]
    columns:
      - name: location_id
        data_tests: [not_null]
      - name: city
        data_tests: [not_null]
      - name: parameter
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pm25", "pm10", "o3", "no2", "co", "so2"]
              config:
                severity: warn
      - name: value
        data_tests: [not_null]
      - name: measured_at_utc
        data_tests: [not_null]
